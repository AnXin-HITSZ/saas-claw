server:
  port: 8888

jwt:
  # 与 backend 同一把 key：线上由 Secret 注入 JWT_SECRET 覆盖，此处为本地兜底（与 backend application.yaml 保持一致）
  secret: ${JWT_SECRET:saas-claw-jwt-secret}

spring:
  application:
    name: gateway
  main:
    web-application-type: reactive
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:saas_claw}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 10
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 5
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: default-route
              uri: http://localhost:8859
              predicates:
                - Path=/**

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印 SQL
    map-underscore-to-camel-case: true                       # 下划线转驼峰
