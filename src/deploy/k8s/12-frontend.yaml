apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: saas-claw
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: crpi-li78f6lp5zheaj11.cn-shenzhen.personal.cr.aliyuncs.com/anxin-hitsz-saas-claw/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # nginx：static + 反代 gateway:8888（同 namespace 短名）
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: saas-claw
  labels:
    app: frontend
spec:
  # NodePort：站点入口。浏览器访问 http://8.135.60.136:30080
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
