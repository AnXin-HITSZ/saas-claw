apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: saas-claw
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: crpi-li78f6lp5zheaj11.cn-shenzhen.personal.cr.aliyuncs.com/anxin-hitsz-saas-claw/gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          # DB_*/REDIS_* 来自 ConfigMap+Secret；JWT_SECRET(无默认值)来自 Secret，
          # 与 backend 同一把 → JWT 签发/校验一致。app.backend.uri 用默认 http://backend:8080。
          envFrom:
            - configMapRef:
                name: saas-claw-config
            - secretRef:
                name: saas-claw-secret
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8888
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: saas-claw
  labels:
    app: gateway
spec:
  # NodePort：外部可直接 Bearer 调 /v1/chat/completions（端到端验收用）。
  # 集群内 frontend 仍走短名 gateway:8888。
  type: NodePort
  selector:
    app: gateway
  ports:
    - port: 8888
      targetPort: 8888
      nodePort: 30888
      protocol: TCP
