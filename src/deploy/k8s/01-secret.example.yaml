# ⚠️ 模板文件：复制为 01-secret.yaml 填入真实值后再 apply。
#   cp 01-secret.example.yaml 01-secret.yaml   # 01-secret.yaml 已被 .gitignore 忽略
# 所有值为轮换后的新凭证（泄露的旧值 AnXin517985! 已作废，切勿使用）。
apiVersion: v1
kind: Secret
metadata:
  name: saas-claw-secret
  namespace: saas-claw
type: Opaque
stringData:
  # ---- MySQL（host 上，私网 IP 172.22.12.159）----
  DB_PASSWORD: "CHANGE_ME_mysql_password"        # saas_app 轮换后的新密码
  # ---- Redis（host 上）----
  REDIS_PASSWORD: "CHANGE_ME_redis_password"     # redis 轮换后的新密码
  # ---- JWT（backend 签发 / gateway 校验，必须同一把）----
  JWT_SECRET: "CHANGE_ME_jwt_base64_secret"      # openssl rand -base64 32
  # ---- OSS ----
  OSS_ACCESS_KEY_ID: "CHANGE_ME_oss_ak_id"
  OSS_ACCESS_KEY_SECRET: "CHANGE_ME_oss_ak_secret"
  # ---- backend 下发给 Claw Pod 的敏感值（claw.k8s.*）----
  # （不再需要平台级程序通道 key：每次创建 Claw，backend 自动签发专属 sk-xxx 并写入该 Claw 的
  #   namespace Secret（BACKEND_API_KEY），authorization 表仅存哈希、归属 claw.userId —— 审批归真实用户。）
  CLAW_K8S_MYSQL_PASSWORD: "CHANGE_ME_mysql_password"      # 同 DB_PASSWORD
  CLAW_K8S_OSS_ACCESS_KEY_ID: "CHANGE_ME_oss_ak_id"        # 同 OSS_ACCESS_KEY_ID
  CLAW_K8S_OSS_ACCESS_KEY_SECRET: "CHANGE_ME_oss_ak_secret"
  # Claw Pod 用的 Redis 连接串（含密码）。host 私网 IP + db 0
  CLAW_K8S_REDIS_URL: "redis://:CHANGE_ME_redis_password@172.22.12.159:6379/0"
